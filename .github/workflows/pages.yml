on:
  push:
    branches:
      - main

  workflow_dispatch:

name: Deploy playground to GitHub Pages
run-name: 'Release Pages: ${{ github.ref_name }}'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (Node.js + pnpm)
        uses: jdx/mise-action@v4

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Builds the package first; the playground runs the built dist, as a consumer would.
      - name: Build the package and the playground
        run: pnpm run playground:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the playground
        uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
