on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

name: CI

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (Node.js + pnpm)
        uses: jdx/mise-action@v4

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Builds the package first, then checks the playground against its published types.
      - name: Type check
        run: pnpm run check-types

      - name: Test
        run: pnpm run test

      - name: Build the playground
        run: pnpm --filter git-meta-up-playground run build
