<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>git-meta-up playground</title>
    <script>
      // Apply the theme before the first paint to avoid a flash: dark unless light was picked.
      let dark = true;
      try {
        dark = localStorage.getItem('git-meta-up:theme') !== 'light';
      } catch {}
      document.documentElement.classList.toggle('dark', dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
